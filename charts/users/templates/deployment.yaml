apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-users
  labels:
    app: users
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/private.key
              subPath: private.key
              readOnly: true
            - name: jwt-keys
              mountPath: /app/public.key
              subPath: public.key
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: {{ .Values.jwt.secretName }}

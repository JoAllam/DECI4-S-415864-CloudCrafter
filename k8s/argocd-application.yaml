apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcrafter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/cloudcrafter.git
    targetRevision: main
    path: charts
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
